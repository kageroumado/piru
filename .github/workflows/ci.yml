name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# IMPORTANT: CI runs ONLY offline checks against data already committed to the
# repo. It never runs the data-fetch / scrape passes (the Swift collector,
# pipeline/fetch/*, or `pipeline/build.sh full`), so it never hits the upstream
# APIs (PsychonautWiki, etc.). Re-fetching is a manual, intentional act.

jobs:
  python:
    name: Python (lint + data + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The substance DB is not tracked in git (see .gitignore). Fetch it before
      # anything reads it: without this, test_sqlite.py's end-to-end suite skips
      # itself on a missing file and the run goes green having checked nothing.
      - name: Fetch the bundled substance DB
        run: Tools/fetch-db.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.15
      # RDKit is a HARD dependency of the data checks, not an optional extra.
      # `structural_dupes.py --gate` imports it unguarded, and the SMILES
      # invariants in test_sqlite.py skip themselves when it is missing — so
      # without this the same-molecule gate crashes and the "every shipped SMILES
      # parses / agrees with its InChIKey" checks quietly pass by not running.
      # The gate step was added in d0407894 and had never executed on CI.
      - run: pip install rdkit==2026.3.4
      - name: Install OpenBabel (for the InChIKey↔SMILES integrity check)
        run: sudo apt-get update && sudo apt-get install -y openbabel
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Validate curated substances
        run: python3 pipeline/build/validate_curated.py
      - name: Pipeline tests (parsers, validators, built-DB invariants)
        run: python3 pipeline/build/tests/test_sqlite.py
      - name: Identifier integrity + regression (InChIKey↔SMILES vs PubChem-verified)
        run: python3 pipeline/build/tests/test_identifier_integrity.py
      - name: Curated overlay integrity (dead files, cross-category clones, InChIKey dups)
        run: python3 pipeline/build/tests/test_overlay_integrity.py
      # Two rows with one structure. Every merge pass in the builder keys on
      # text, so a duplicate whose names don't overlap and whose identifiers
      # don't line up survives all of them — which is how a Schedule I cathinone
      # ended up split across two rows with half its dose ladder on each. A
      # collision is EITHER a duplicate OR a wrong SMILES, so the check reports
      # and data/curated/structural-duplicates.json records the decision.
      - name: No unadjudicated same-molecule rows
        run: python3 pipeline/audit/structural_dupes.py --gate
      # The catalog's removals are adjudicated, not incidental: diagnostic
      # analytes, cosmetic-cream peptides, lab reagents, and rows whose only
      # content was a banner saying they had no content. An upstream refresh
      # reintroduces them silently, so the list is a gate, not a one-off edit.
      - name: Removed substances stay removed (and stay reviewable)
        run: python3 pipeline/build/tests/test_removed_substances.py
      - name: Link-validator tests (verdict + cache staleness)
        run: python3 pipeline/audit/tests/test_validate_links.py
      # Unit canonicalisation and match strength decide whether the value check
      # is deterministic or merely plausible, so they are pinned rather than
      # trusted: a row holding ki_nm = 66.4 has to match "0.0664 µM" and "pKi
      # 7.18", and must NOT be "confirmed" by a coincidental "50%".
      - name: Citation-sourcing tests (units, match strength, MeSH domain)
        run: python3 pipeline/audit/tests/test_citation_sourcing.py
      - name: Dedupe tests (exact rows, prose echoes, value duplicates)
        run: python3 pipeline/build/tests/test_dedupe.py
      - name: No duplicated values in the shipped DB
        run: python3 pipeline/audit/dedup_check.py --gate
      - name: No fabricated or unverified citations
        run: python3 pipeline/audit/verify_citations.py --offline --gate
      # verify_citations proves an identifier RESOLVES. This asks whether the
      # paper is about the right molecule — the failure that let 28 benzofuran
      # binding rows cite a two-page editorial and LSD's 5-HT2A rows cite a
      # cancer-genetics paper, both of which resolved perfectly. Adjudicated
      # false positives live in data/curated/citation-topicality-allowlist.json.
      #
      # --gate-absent also fails a HARD ABSENCE: the paper names no compound at
      # all, the absence was confirmed against a full abstract, and the citing
      # row is a per-compound number. WRONG_SUBSTANCE is structurally blind to
      # that shape, which is how a nursing-ethics bibliography shipped as
      # cannabis's CB1 Kᵢ. The 178 known-real defects outstanding on 2026-08-04
      # sit in citation-topicality-backlog.json — a SEPARATE file from the
      # allowlist because they mean opposite things, and nothing may be added
      # to it. That is what makes this a ratchet rather than a rubber stamp.
      - name: No citations attached to the wrong substance
        run: python3 pipeline/audit/citation_topicality.py --offline --gate --gate-absent
      # verify_citations proves the identifier RESOLVES; citation_topicality
      # proves the paper is about the right molecule. Neither compares the
      # identifier to the human LABEL a curator wrote beside it — which is how
      # fifteen rows cited "Abelian 2024 SAR paper" at a PMID that is an
      # archaeology news piece in Science.
      - name: Citation labels match the record they point at
        run: python3 pipeline/audit/citation_labels.py --gate

  swift-lint:
    name: Swift (format + lint)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install swiftformat swiftlint
      - name: SwiftFormat (check only)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --quiet

  swift-build:
    name: Swift (build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The substance DB is not tracked in git (see .gitignore). Fetch it before
      # anything reads it: without this, test_sqlite.py's end-to-end suite skips
      # itself on a missing file and the run goes green having checked nothing.
      - name: Fetch the bundled substance DB
        run: Tools/fetch-db.sh
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build SubstanceCollector (SPM)
        run: swift build --package-path Tools/SubstanceCollector
      # Requires a runner Xcode with the iOS 26 SDK + an iPhone 17 Pro simulator.
      - name: Build & test the app
        run: |
          xcodebuild -scheme Piru \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            test | tail -40
