<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pill capsule body -->
  <rect x="4" y="3" width="14" height="26" rx="7" fill="white"/>
  <!-- Pill dividing line -->
  <line x1="4" y1="16" x2="18" y2="16" stroke="black" stroke-width="1.5" opacity="0.25"/>

  <!-- Clock: knockout circle for contrast -->
  <circle cx="22" cy="10" r="7.5" fill="black"/>
  <!-- Clock face outline -->
  <circle cx="22" cy="10" r="6" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Hour hand (pointing to 12) -->
  <line x1="22" y1="10" x2="22" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 3) -->
  <line x1="22" y1="10" x2="25.5" y2="10" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="22" cy="10" r="0.8" fill="white"/>
</svg>
